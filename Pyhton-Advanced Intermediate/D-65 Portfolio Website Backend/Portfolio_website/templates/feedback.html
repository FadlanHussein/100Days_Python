<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback</title>
  </head>
  <body>
    <h1>Feedback</h1>
    {% for item in feedback %}
    <ul>
      <li>
        <strong>Name: {{ item.name }}</strong>
        <strong>Email: {{ item.email }}</strong>
        <strong>Message: {{ item.message }}</strong>
        <hr />
      </li>
    </ul>
    {% endfor %}
  </body>
</html>
