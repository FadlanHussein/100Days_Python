<!DOCTYPE html>
<html>
    <title>My Personal Blog</title>
    <head>
<body>
        <h1>Welcome to My Personal Blog</h1>
        <p>This is a simple blog website built with Flask.</p>
        {% for post in posts %}
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
            <a href="{{ url_for('post', post_id=post.id) }}">Read More</a>
        {% endfor %}
</body>
</html>
